<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waleska Tirado Pacheco - Resume</title>
    <style>
        body {
            background-color: #e6e0f8;
            margin: 0;
            font-family: 'Helvetica Neue', sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            border: 2px solid #b583d8;
            border-radius: 10px;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2, h3 {
            color: #4b0082; /* Dark purple color */
            text-align: center;
        }

        h1 {
            font-size: 2em;
            border-bottom: 2px solid #b583d8;
            padding-bottom: 10px;
        }

        h2 {
            color: #4b0082; /* Dark purple color */
            font-size: 1.5em;
            border-bottom: 1px solid #b583d8;
            padding-bottom: 5px;
            margin-top: 20px;
        }

        p, ul {
            line-height: 1.6;
            margin: 10px 0;
        }

        ul {
            padding-left: 20px;
        }

        .contact-info, .skills, .experience, .education, .projects, .certifications {
            margin-bottom: 20px;
        }

        .contact-info a {
            color: #d1633c;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        .section-title {
            background-color: #d4a3e6;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 10px;
            color: #4b0082; /* Dark purple color */
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .gallery img {
            width: 250px; /* Increased size for larger thumbnails */
            height: 250px; /* Ensures the thumbnails remain square */
            object-fit: cover; /* Crops the image to fit the square without distortion */
            border-radius: 10px; /* Adds rounded corners */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Adds a subtle shadow for a modern look */
        }

        .gallery-title {
            width: 100%;
            text-align: center;
            background-color: #d4a3e6;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #4b0082; /* Dark purple color */
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Waleska Tirado Pacheco</h1>
        <div class="contact-info">
            <p>📍 Deltona, FL | 📧 <a href="mailto:wt.illustrates@gmail.com">wt.illustrates@gmail.com</a> | 📞 (689) 313-1365</p>
            <p>🔗 <a href="https://beacons.page/wtillustrates" target="_blank">Business & Portfolio Hub</a></p>
        </div>
        <h2>Creative Graphic Designer & Digital Artist</h2>
        <p>Bringing visions to life through bold, innovative, and engaging visual storytelling.</p>
        <div class="gallery">
            <div class="gallery-title">Showcased Illustration Digital Art</div>
            <img src="coverart.jpg" alt="Cover Art">
            <img src="cat.jpg" alt="Cat Illustration Digital Art">
            <img src="cookies.jpg" alt="Cookies Illustration Digital Art">
            <img src="girl.jpg" alt="Girl Illustration Digital Art">
        </div>
    </div>
</body>
</html>
