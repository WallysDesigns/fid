<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waleska Tirado Pacheco - Resume</title>
    <style>
        body {
            background-color: #e6e0f8;
            margin: 0;
            font-family: 'Helvetica Neue', sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            border: 2px solid #b583d8;
            border-radius: 10px;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .gallery img {
            width: 150px;
            height: 150px;
            object-fit: cover; /* Ensures the image fills the square without distortion */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .gallery-title {
            width: 100%;
            text-align: center;
            background-color: #d4a3e6;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #5a3e36;
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gallery">
            <div class="gallery-title">Showcased Illustration Digital Art</div>
            <img src="coverart.jpg" alt="Cover Art">
            <img src="cat.jpg" alt="Cat Illustration Digital Art">
            <img src="cookies.jpg" alt="Cookies Illustration Digital Art">
            <img src="girl.jpg" alt="Girl Illustration Digital Art">
        </div>
    </div>
</body>
</html>
