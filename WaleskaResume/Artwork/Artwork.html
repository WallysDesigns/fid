<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waleska Tirado Pacheco - Artwork</title>
    <style>
        body {
            background-color: #e6e0f8;
            margin: 0;
            font-family: 'Helvetica Neue', sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            border: 2px solid #b583d8;
            border-radius: 10px;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #4b0082; /* Dark purple color */
            text-align: center;
        }

        h1 {
            font-size: 2em;
            border-bottom: 2px solid #b583d8;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 1.5em;
            margin-top: 20px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            text-align: center;
            max-width: 250px;
        }

        .gallery img {
            width: 250px; /* Large square images */
            height: 250px;
            object-fit: cover; /* Ensures no distortion */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05); /* Slight zoom effect on hover */
        }

        .gallery p {
            margin-top: 10px;
            font-size: 0.9em;
            color: #555;
        }

        .nav {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav a {
            text-decoration: none;
            color: #4b0082;
            font-weight: bold;
            margin: 0 10px;
            padding: 5px 10px;
            border: 2px solid #b583d8;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav a:hover {
            background-color: #b583d8;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Waleska Tirado Pacheco</h1>
        <div class="nav">
            <!-- Link to the Resume page -->
            <a href="Waleska_Resume.html">Resume</a>
            <!-- Link to the Artwork page -->
            <a href="Artwork.html">Artwork</a>
        </div>
        <h2>Showcased Artwork</h2>
        <div class="gallery">
            <div class="gallery-item">
                <img src="coverart.jpg" alt="Cover Art">
                <p>This is a cover art made for artists @officialkingkoolin and @topoppjodi.</p>
            </div>
            <div class="gallery-item">
                <img src="cat.jpg" alt="Cat Illustration">
                <p>This is a classic cat drawing illustration.</p>
            </div>
            <div class="gallery-item">
                <img src="cookies.jpg" alt="Cookies Illustration">
                <p>This is part of a series of the Strawberry Shortcake characters reinvented.</p>
            </div>
            <div class="gallery-item">
                <img src="girl.jpg" alt="Halloween Illustration">
                <p>This is part of the 2023 Halloween series.</p>
            </div>
        </div>
    </div>
</body>
</html>
